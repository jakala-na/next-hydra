name: Registry integrity

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate registry integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check generated registry manifests
        run: pnpm registry:check

      - name: Test registry composition
        run: pnpm --filter create-next-hydra test

  composed-applications:
    name: Generated code / ${{ matrix.workspace }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - cms-contentstack
          - cms-drupal
          - cms-search-contentstack
          - cms-search-drupal
          - storefront-contentstack
          - storefront-drupal
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install composition tooling
        run: pnpm --filter 'next-hydra...' --filter 'create-next-hydra...' install --frozen-lockfile --ignore-scripts

      - name: Materialize application and install selected dependencies
        run: pnpm --filter create-next-hydra compose "${{ matrix.workspace }}"

      - name: Check freshness and typecheck generated applications
        run: pnpm --filter create-next-hydra workspace:check "${{ matrix.workspace }}"
