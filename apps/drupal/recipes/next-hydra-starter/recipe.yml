name: 'Next Hydra starter'
description: 'A minimal Drupal backend for Next Hydra with landing pages, articles, Hydra blocks, native navigation, GraphQL, and preview.'
type: 'Site'

recipes:
  - core/recipes/administrator_role
  - core/recipes/content_editor_role
  - core/recipes/core_recommended_maintenance
  - core/recipes/image_media_type

install:
  - canvas
  - canvas_headless
  - canvas_translate
  - ckeditor5
  - config_translation
  - content_translation
  - field_ui
  - file
  - filter
  - help
  - image
  - language
  - link
  - locale
  - media
  - media_library
  - menu_link_content
  - menu_ui
  - next
  - next_hydra
  - node
  - path
  - toolbar
  - text
  - views
  - views_ui
  - gin
  - gin_toolbar
  - paragraphs
  - simple_oauth
  - view_unpublished
  - graphql_compose
  - graphql_compose_menus
  - graphql_compose_routes
  - graphql_compose_preview

config:
  strict:
    - editor.editor.basic_html
    - field.storage.node.field_components
    - field.storage.node.body
    - field.storage.node.field_display_title
    - field.storage.node.field_hide_display_title
    - field.storage.node.field_image
    - field.storage.node.field_summary
    - field.storage.paragraph.field_actions
    - field.storage.paragraph.field_articles
    - field.storage.paragraph.field_description
    - field.storage.paragraph.field_heading
    - field.storage.paragraph.field_image
    - field.storage.paragraph.field_product_category
    - field.storage.paragraph.field_tagline
    - filter.format.basic_html
  import:
    gin:
      - block.block.gin_breadcrumbs
      - block.block.gin_content
      - block.block.gin_help
      - block.block.gin_local_actions
      - block.block.gin_messages
      - block.block.gin_page_title
      - block.block.gin_primary_local_tasks
  actions:
    language.entity.en:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: en
        label: 'English (United States)'
        direction: ltr
        weight: 0
        locked: false
    language.entity.und:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: und
        label: 'Not specified'
        direction: ltr
        weight: 8
        locked: true
    language.entity.zxx:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: zxx
        label: 'Not applicable'
        direction: ltr
        weight: 9
        locked: true
    language.entity.en-gb:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: en-gb
        label: 'English, British'
        direction: ltr
        weight: 1
        locked: false
    language.entity.es:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: es
        label: Spanish
        direction: ltr
        weight: 2
        locked: false
    language.entity.fr:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: fr
        label: French
        direction: ltr
        weight: 3
        locked: false
    language.entity.de:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: de
        label: German
        direction: ltr
        weight: 4
        locked: false
    language.entity.it:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: it
        label: Italian
        direction: ltr
        weight: 5
        locked: false
    language.entity.pt-pt:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: pt-pt
        label: 'Portuguese, Portugal'
        direction: ltr
        weight: 6
        locked: false
    language.entity.nl:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: nl
        label: Dutch
        direction: ltr
        weight: 7
        locked: false
    language.negotiation:
      simpleConfigUpdate:
        url.prefixes:
          en: ''
          en-gb: en-GB
          es: es-ES
          fr: fr-FR
          de: de-DE
          it: it-IT
          pt-pt: pt-PT
          nl: nl-NL
        url.domains:
          en: ''
          en-gb: ''
          es: ''
          fr: ''
          de: ''
          it: ''
          pt-pt: ''
          nl: ''
    canvas.page_region.next_hydra.pre_header:
      setProperties:
        component_tree:
          - uuid: 37a586d3-d6bf-4a2e-9be6-bf3105aa6e71
            component_id: js.text
            component_version: 9a9978112194b13f
            inputs: '{"text":"Global pre-header region"}'
            label: 'Global pre-header region'
    canvas.page_region.next_hydra.post_header:
      setProperties:
        component_tree:
          - uuid: 86010f15-13da-47ab-9095-316034f5bc8a
            component_id: js.text
            component_version: 9a9978112194b13f
            inputs: '{"text":"Global post-header region"}'
            label: 'Global post-header region'
    canvas.page_region.next_hydra.pre_footer:
      setProperties:
        component_tree:
          - uuid: 2fe3bee3-55a4-43af-9ad6-c88dc8e8478d
            component_id: js.text
            component_version: 9a9978112194b13f
            inputs: '{"text":"Global pre-footer region"}'
            label: 'Global pre-footer region'
    canvas.page_region.next_hydra.post_footer:
      setProperties:
        component_tree:
          - uuid: b2212bb7-d140-4542-8a12-70cd475981fd
            component_id: js.text
            component_version: 9a9978112194b13f
            inputs: '{"text":"Global post-footer region"}'
            label: 'Global post-footer region'
    locale.settings:
      simpleConfigUpdate:
        translation.import_enabled: true
        translation.update_interval_days: 7
    # A saved disabled -> enabled transition ensures Content Translation installs
    # its metadata fields through the config-entity API.
    language.content_settings.node.article:
      createIfNotExists:
        target_entity_type_id: node
        target_bundle: article
      setProperties:
        default_langcode: site_default
        language_alterable: true
      setThirdPartySettings:
        - module: content_translation
          key: enabled
          value: false
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: true
    language.content_settings.node.landing_page:
      createIfNotExists:
        target_entity_type_id: node
        target_bundle: landing_page
      setProperties:
        default_langcode: site_default
        language_alterable: true
      setThirdPartySettings:
        - module: content_translation
          key: enabled
          value: false
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: true
    language.content_settings.paragraph.hero:
      createIfNotExists:
        target_entity_type_id: paragraph
        target_bundle: hero
      setProperties:
        default_langcode: site_default
        language_alterable: true
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: false
      setThirdPartySettings:
        - module: content_translation
          key: enabled
          value: true
        - module: content_translation
          key: bundle_settings
          value:
            untranslatable_fields_hide: '1'
    language.content_settings.paragraph.dynamic_product_collection:
      createIfNotExists:
        target_entity_type_id: paragraph
        target_bundle: dynamic_product_collection
      setProperties:
        default_langcode: site_default
        language_alterable: true
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: false
      setThirdPartySettings:
        - module: content_translation
          key: enabled
          value: true
        - module: content_translation
          key: bundle_settings
          value:
            untranslatable_fields_hide: '1'
    language.content_settings.paragraph.featured_articles:
      createIfNotExists:
        target_entity_type_id: paragraph
        target_bundle: featured_articles
      setProperties:
        default_langcode: site_default
        language_alterable: true
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: false
      setThirdPartySettings:
        - module: content_translation
          key: enabled
          value: true
        - module: content_translation
          key: bundle_settings
          value:
            untranslatable_fields_hide: '1'
    language.content_settings.menu_link_content.menu_link_content:
      createIfNotExists:
        target_entity_type_id: menu_link_content
        target_bundle: menu_link_content
      setProperties:
        default_langcode: site_default
        language_alterable: true
      setThirdPartySettings:
        - module: content_translation
          key: enabled
          value: false
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: true
    language.content_settings.media.image:
      createIfNotExists:
        target_entity_type_id: media
        target_bundle: image
      setProperties:
        default_langcode: site_default
        language_alterable: true
      setThirdPartySettings:
        - module: content_translation
          key: enabled
          value: false
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: true
    language.content_settings.canvas_page.canvas_page:
      createIfNotExists:
        target_entity_type_id: canvas_page
        target_bundle: canvas_page
      setProperties:
        default_langcode: site_default
        language_alterable: true
      setThirdPartySettings:
        - module: content_translation
          key: enabled
          value: false
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: true
    system.site:
      simpleConfigUpdate:
        default_langcode: en
        page.front: /homepage
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: true
    system.theme:
      simpleConfigUpdate:
        admin: gin
        default: next_hydra
    simple_oauth.settings:
      simpleConfigUpdate:
        access_token_expiration: 2592000
        authorization_code_expiration: 2592000
        refresh_token_expiration: 2592000
        token_cron_batch_size: 0
        public_key: ../keys/public.key
        private_key: ../keys/private.key
        remember_clients: true
        use_implicit: false
        disable_openid_connect: false
    user.role.content_editor:
      grantPermissions:
        - 'access content overview'
        - 'access media overview'
        - 'create article content'
        - 'create content translations'
        - 'create landing_page content'
        - 'create media'
        - 'delete any article content'
        - 'delete any landing_page content'
        - 'delete article revisions'
        - 'delete landing_page revisions'
        - 'edit any article content'
        - 'edit any landing_page content'
        - 'revert article revisions'
        - 'revert landing_page revisions'
        - 'translate editable entities'
        - 'update any media'
        - 'update content translations'
        - 'use text format basic_html'
        - 'view article revisions'
        - 'view landing_page revisions'
    user.role.viewer:
      grantPermissions:
        - 'execute graphql_compose_server arbitrary graphql requests'
    user.role.previewer:
      grantPermissions:
        - 'execute graphql_compose_server arbitrary graphql requests'
