  body:
    -
      value: '<p>Excavator selection starts with the work envelope: dig depth, lift radius, ground conditions, and access to the site.</p><h2>Start with the work, not the machine</h2><p>Document the heaviest expected lift, the furthest safe working radius, and the narrowest access point. Those constraints quickly narrow the viable operating-weight class.</p><h2>Account for attachments</h2><p>Hydraulic demand, attachment weight, and coupler geometry all affect real capacity. Validate the complete configuration rather than relying on the base machine specification.</p><h2>Plan for transport</h2><p>Transport permits and trailer availability can outweigh a small productivity gain. The best machine is one that can reach the site and work safely throughout the project.</p>'
      format: basic_html
      summary: ''
