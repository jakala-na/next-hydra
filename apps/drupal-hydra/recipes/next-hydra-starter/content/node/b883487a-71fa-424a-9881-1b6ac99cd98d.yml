  body:
    -
      value: '<p>Preventive maintenance works when every inspection has an owner, a frequency, and a clear escalation path.</p><h2>Before every shift</h2><p>Inspect fluid levels, hoses, undercarriage components, work lights, alarms, and visible fasteners. Record leaks and abnormal wear before the machine starts work.</p><h2>Track operating conditions</h2><p>Dust, heat, cold, and prolonged idling can shorten service intervals. Use telematics and operator notes to adjust the plan to actual conditions.</p><h2>Close the loop</h2><p>A checklist is only useful when findings become work orders. Review recurring defects monthly and correct the underlying operating or maintenance issue.</p>'
