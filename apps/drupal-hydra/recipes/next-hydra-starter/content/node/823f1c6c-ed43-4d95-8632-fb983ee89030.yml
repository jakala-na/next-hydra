  body:
    -
      value: '<p>Machine weight tells only part of the story. Ground pressure explains how that weight is distributed across the working surface.</p><h2>Use the configured operating weight</h2><p>Include the operator, fuel, standard bucket, coupler, and any guarding or counterweight options. Shipping weight is not a working-site specification.</p><h2>Look beyond the headline number</h2><p>Track width, shoe design, and undercarriage length influence flotation and stability. Compare machines in the configuration that will actually be delivered.</p><h2>Validate the site</h2><p>Soft ground, buried services, suspended slabs, and finished surfaces may impose limits well below the machine rating. Confirm allowable loading with the responsible site engineer.</p>'
      format: basic_html
      summary: ''
