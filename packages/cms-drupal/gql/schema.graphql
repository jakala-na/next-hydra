"""The schema's entry-point for queries."""
type Query {
  """Load a Menu by name."""
  menu(
    """Internal menu name. Eg MAIN"""
    name: MenuAvailable!
  ): Menu

  """Schema information."""
  info: SchemaInformation!

  """Load a content preview."""
  preview(
    """The content UUID."""
    id: ID!

    """A preview access token."""
    token: String

    """
    Optionally set the response language. Eg en, ja, fr. Setting this langcode
    will change the current language of the entire response.
    """
    langcode: String
  ): NodeUnion

  """Load a Route by path."""
  route(
    """Internal path to load. Eg /about"""
    path: String!

    """
    Optionally set the revision of the entity. Eg current, latest, or an ID.
    """
    revision: ID
  ): RouteUnion
}

"""List of menus available to load."""
enum MenuAvailable {
  """Main navigation"""
  MAIN
}

"""Entity type menu."""
type Menu implements MenuInterface {
  """The entity ID."""
  id: ID!

  """The Universally Unique IDentifier (UUID)."""
  uuid: ID!

  """The menu items."""
  items: [MenuItem!]!

  """The menu name."""
  name: String!
}

"""Entity type menu."""
interface MenuInterface {
  """The entity ID."""
  id: ID!

  """The Universally Unique IDentifier (UUID)."""
  uuid: ID!

  """The menu items."""
  items: [MenuItem!]!

  """The menu name."""
  name: String!
}

"""A menu item defined in the CMS."""
type MenuItem {
  """The Universally Unique IDentifier (UUID)."""
  id: ID!

  """The title of the menu item."""
  title: String!

  """The description of the menu item."""
  description: String

  """The URL of the menu item."""
  url: String

  """The language of the menu item."""
  langcode: Language!

  """Whether this menu item links to an internal route."""
  internal: Boolean!

  """Whether this menu item is intended to be expanded."""
  expanded: Boolean!

  """Attributes of this menu item."""
  attributes: MenuItemAttributes!

  """Child menu items of this menu item."""
  children: [MenuItem!]!

  """
  The route this menu item uses. Route loading can be disabled per menu type.
  """
  route: RouteUnion
}

"""A language definition provided by the CMS."""
type Language {
  """The language code."""
  id: ID

  """The language name."""
  name: String

  """The language direction."""
  direction: String
}

"""Menu item options set within the CMS."""
type MenuItemAttributes {
  """Menu item attribute class."""
  class: String
}

"""Route types that can exist in the system."""
union RouteUnion = RouteInternal | RouteExternal

"""Route within this website."""
type RouteInternal implements Route {
  """URL of this route."""
  url: String!

  """Whether this route is internal or external."""
  internal: Boolean!

  """Breadcrumb links for this route."""
  breadcrumbs: [Link!]

  """Content assigned to this route."""
  entity: RouteEntityUnion
}

"""Routes represent incoming requests that resolve to content."""
interface Route {
  """URL of this route."""
  url: String!

  """Whether this route is internal or external."""
  internal: Boolean!
}

"""A link."""
type Link {
  """The title of the link."""
  title: String

  """The URL of the link."""
  url: String

  """Whether the link is internal to this website."""
  internal: Boolean!
}

"""A list of possible entities that can be returned by URL."""
union RouteEntityUnion = NodeLandingPage

"""Routeable pages composed from Hydra CMS blocks."""
type NodeLandingPage implements NodeInterface {
  """The entity ID."""
  id: ID!

  """The Universally Unique IDentifier (UUID)."""
  uuid: ID!

  """The time that the node was last edited."""
  changed: DateTime!

  """Ordered Hydra content blocks."""
  components: [ParagraphUnion!]

  """The date and time that the content was created."""
  created: DateTime!

  """Optional public heading; the node title remains the editorial name."""
  displayTitle: String

  """Keep the display title available to metadata while hiding it visually."""
  hideDisplayTitle: Boolean

  """Language"""
  langcode: Language!

  """URL alias"""
  path: String

  """Promoted to front page"""
  promote: Boolean!

  """Published"""
  status: Boolean!

  """Sticky at top of lists"""
  sticky: Boolean!

  """Title"""
  title: String!
}

"""Entity type node."""
interface NodeInterface {
  """The entity ID."""
  id: ID!

  """The Universally Unique IDentifier (UUID)."""
  uuid: ID!

  """The time that the node was last edited."""
  changed: DateTime!

  """The date and time that the content was created."""
  created: DateTime!

  """Language"""
  langcode: Language!

  """URL alias"""
  path: String

  """Promoted to front page"""
  promote: Boolean!

  """Published"""
  status: Boolean!

  """Sticky at top of lists"""
  sticky: Boolean!

  """Title"""
  title: String!
}

"""A DateTime object."""
type DateTime {
  """
  Type represents date and time as number of milliseconds from start of the UNIX epoch.
  """
  timestamp: Timestamp!

  """A field whose value exists in the standard IANA Time Zone Database."""
  timezone: TimeZone!

  """A string that will have a value of format ±hh:mm"""
  offset: UtcOffset!

  """RFC 3339 compliant time string."""
  time: Time!
}

"""
Type represents date and time as number of milliseconds from start of the UNIX epoch.
"""
scalar Timestamp

"""A field whose value exists in the standard IANA Time Zone Database."""
scalar TimeZone

"""A string that will have a value of format ±hh:mm"""
scalar UtcOffset

"""RFC 3339 compliant time string."""
scalar Time

"""Entity type paragraph."""
union ParagraphUnion = ParagraphDynamicProductCollection | ParagraphHero

"""Renders products selected by an external commerce category ID."""
type ParagraphDynamicProductCollection implements ParagraphInterface {
  """The entity ID."""
  id: ID!

  """The Universally Unique IDentifier (UUID)."""
  uuid: ID!

  """The time that the Paragraph was created."""
  created: DateTime!

  """Description"""
  description: String

  """Heading"""
  heading: String

  """The paragraphs entity language code."""
  langcode: Language!

  """
  Optional external category ID resolved by the active commerce provider. Leave
  empty to show products without a category filter.
  """
  productCategory: String

  """Published"""
  status: Boolean!
}

"""Entity type paragraph."""
interface ParagraphInterface {
  """The entity ID."""
  id: ID!

  """The Universally Unique IDentifier (UUID)."""
  uuid: ID!

  """The time that the Paragraph was created."""
  created: DateTime!

  """The paragraphs entity language code."""
  langcode: Language!

  """Published"""
  status: Boolean!
}

"""
Hydra hero with tagline, heading, description, image, and up to two actions.
"""
type ParagraphHero implements ParagraphInterface {
  """The entity ID."""
  id: ID!

  """The Universally Unique IDentifier (UUID)."""
  uuid: ID!

  """Actions"""
  actions: [Link!]

  """The time that the Paragraph was created."""
  created: DateTime!

  """Description"""
  description: String!

  """Heading"""
  heading: String!

  """Image"""
  image: MediaUnion!

  """The paragraphs entity language code."""
  langcode: Language!

  """Published"""
  status: Boolean!

  """Optional short label above the hero heading."""
  tagline: String
}

